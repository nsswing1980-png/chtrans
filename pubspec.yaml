name: language_tutor
description: 中国語・日本語翻訳学習アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: 6.1.5+1
  http: 1.5.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  shared_preferences: 2.5.3
  flutter_tts: ^4.2.0
  intl: ^0.19.0
  diff_match_patch: ^0.4.1
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
